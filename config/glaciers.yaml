  target_year: ~2000
  source: https://nsidc.org/data/nsidc-0770/versions/7

defaults:
  season: ["07-20", "09-20"]
  max_cloud: 30
  n_best: 5
  dem: "aw3d30"      # matches the research paper’s Alaska setup
  use_l9: true

